spring.application.name=docextract
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# OCR tier. engine: auto (Python OCR service when it is up, else Tesseract) | python | tesseract
docextract.ocr.engine=auto
docextract.ocr.service-url=${OCR_SERVICE_URL:http://127.0.0.1:8001}
docextract.ocr.service-timeout-seconds=180
# Tesseract fallback (Tess4J). Directory holding <language>.traineddata.
docextract.ocr.tessdata-path=${TESSDATA_PREFIX:.tools/tessdata}
docextract.ocr.language=eng
docextract.ocr.max-pages=10

# Vision-LLM tier (OpenAI). Without a key the tier reports "tier not configured"; it never fakes output.
docextract.vision.api-key=${OPENAI_API_KEY:}
docextract.vision.base-url=https://api.openai.com/v1
docextract.vision.model=gpt-4o-mini
docextract.vision.max-pages=3
docextract.vision.timeout-seconds=90

# x-labels / x-rules are our own schema extensions; the validator need not warn about them.
logging.level.com.networknt.schema.UnknownKeywordFactory=ERROR

# Local secrets (e.g. docextract.vision.api-key=...), never committed: .tools/ is git-ignored.
spring.config.import=optional:file:./.tools/secrets.properties

# Adaptive parser (/api/parse). Every page is planned on its own; these are the checks that escalate it.
# Fewer letters/digits than this on a PDF page: no usable text layer -> OCR
docextract.parse.min-chars-per-page=20
# Share of glyphs that decode to nothing readable above which the text layer counts as broken -> OCR
docextract.parse.max-garbage-ratio=0.10
# A page this much covered by images, with little text, is a scan -> OCR
docextract.parse.image-page-ratio=0.60
# OCR'd pages below this mean confidence are read again at ocr-retry-dpi; the more confident reading is kept
docextract.parse.low-ocr-confidence=0.85
docextract.parse.ocr-retry-dpi=450
# OCR the text inside images on text pages (diagrams, charts); per request: figures=false
docextract.parse.region-ocr=true
