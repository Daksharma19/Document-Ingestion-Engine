spring.application.name=docextract
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# OCR tier (Tess4J). Directory holding <language>.traineddata.
docextract.ocr.tessdata-path=${TESSDATA_PREFIX:.tools/tessdata}
docextract.ocr.language=eng
docextract.ocr.max-pages=10

# Vision-LLM tier (OpenAI). Without a key the tier reports "tier not configured"; it never fakes output.
docextract.vision.api-key=${OPENAI_API_KEY:}
docextract.vision.base-url=https://api.openai.com/v1
docextract.vision.model=gpt-4o-mini
docextract.vision.max-pages=3
docextract.vision.timeout-seconds=90

# x-labels / x-rules are our own schema extensions; the validator need not warn about them.
logging.level.com.networknt.schema.UnknownKeywordFactory=ERROR
